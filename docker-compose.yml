# ==============================================================================
# AI-Powered Job Search Assistant - Docker Compose (Development)
# ==============================================================================
# Usage: docker-compose up --build
# Services: backend (Flask API + AI agent), db (PostgreSQL), redis

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:14-alpine
    container_name: jobassistant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobassistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobassistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobassistant-network

  # ============================================================================
  # Redis Cache & Rate Limiting
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: jobassistant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobassistant-network

  # ============================================================================
  # Backend API (Flask)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: jobassistant-backend
    environment:
      - FLASK_APP=${FLASK_APP}
      - FLASK_ENV=${FLASK_ENV}
      - FLASK_DEBUG=${FLASK_DEBUG}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRES=${JWT_ACCESS_TOKEN_EXPIRES}
      - JWT_REFRESH_TOKEN_EXPIRES=${JWT_REFRESH_TOKEN_EXPIRES}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - DB_POOL_SIZE=${DB_POOL_SIZE}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW}
      - CACHE_DEFAULT_TTL=${CACHE_DEFAULT_TTL}
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      - RATELIMIT_ENABLED=${RATELIMIT_ENABLED}
      - RATELIMIT_STORAGE_URL=${RATELIMIT_STORAGE_URL}
      - RATELIMIT_DEFAULT=${RATELIMIT_DEFAULT}
      - RATELIMIT_AUTH=${RATELIMIT_AUTH}
      - RATELIMIT_CHAT=${RATELIMIT_CHAT}
      - RATELIMIT_JOB_SEARCH=${RATELIMIT_JOB_SEARCH}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
      - USE_DUMMY_DATA=${USE_DUMMY_DATA}
      - SKIP_EMAIL_SENDING=${SKIP_EMAIL_SENDING}
    env_file:
      - ./.env
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jobassistant-network
    command: flask run --host=0.0.0.0 --port=5000 --reload

# ==============================================================================
# Networks
# ==============================================================================
networks:
  jobassistant-network:
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
  redis_data:
  backend_venv:
