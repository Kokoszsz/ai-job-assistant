# ==============================================================================
# AI-Powered Job Search Assistant - Docker Compose (Development)
# ==============================================================================
# Usage: docker-compose up --build
# Services: backend, frontend, mcp, db (PostgreSQL), redis

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:14-alpine
    container_name: jobassistant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobassistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobassistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobassistant-network

  # ============================================================================
  # Redis Cache & Rate Limiting
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: jobassistant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobassistant-network

  # ============================================================================
  # Backend API (Flask)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: jobassistant-backend
    environment:
      - FLASK_APP=${FLASK_APP}
      - FLASK_ENV=${FLASK_ENV}
      - FLASK_DEBUG=${FLASK_DEBUG}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MCP_SERVICE_URL=${MCP_SERVICE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRES=${JWT_ACCESS_TOKEN_EXPIRES}
      - JWT_REFRESH_TOKEN_EXPIRES=${JWT_REFRESH_TOKEN_EXPIRES}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID}
      - ADZUNA_API_KEY=${ADZUNA_API_KEY}
      - ADZUNA_COUNTRY=${ADZUNA_COUNTRY}
      - DB_POOL_SIZE=${DB_POOL_SIZE}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW}
      - CACHE_DEFAULT_TTL=${CACHE_DEFAULT_TTL}
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      - RATELIMIT_ENABLED=${RATELIMIT_ENABLED}
      - RATELIMIT_STORAGE_URL=${RATELIMIT_STORAGE_URL}
      - RATELIMIT_DEFAULT=${RATELIMIT_DEFAULT}
      - RATELIMIT_AUTH=${RATELIMIT_AUTH}
      - RATELIMIT_CHAT=${RATELIMIT_CHAT}
      - RATELIMIT_JOB_SEARCH=${RATELIMIT_JOB_SEARCH}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
      - USE_DUMMY_DATA=${USE_DUMMY_DATA}
      - SKIP_EMAIL_SENDING=${SKIP_EMAIL_SENDING}
    env_file:
      - ./.env
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jobassistant-network
    command: flask run --host=0.0.0.0 --port=5000 --reload

  # ============================================================================
  # Frontend (React/Next.js)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: jobassistant-frontend
    environment:
      - NODE_ENV=${ENVIRONMENT:-development}
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - REACT_APP_WS_URL=${REACT_APP_WS_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - REACT_APP_TITLE=${REACT_APP_TITLE}
      - NEXT_PUBLIC_TITLE=${NEXT_PUBLIC_TITLE}
      - REACT_APP_ENABLE_ANALYTICS=${REACT_APP_ENABLE_ANALYTICS}
      - NEXT_PUBLIC_ENABLE_ANALYTICS=${NEXT_PUBLIC_ENABLE_ANALYTICS}
      - PORT=${PORT}
      - GENERATE_SOURCEMAP=${GENERATE_SOURCEMAP}
      - BROWSER=${BROWSER}
      - SKIP_PREFLIGHT_CHECK=${SKIP_PREFLIGHT_CHECK}
      - WATCHPACK_POLLING=true
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - jobassistant-network

  # ============================================================================
  # MCP Service (AI Agents)
  # ============================================================================
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
      target: development
    container_name: jobassistant-mcp
    environment:
      - MCP_HOST=${MCP_HOST}
      - MCP_PORT=${MCP_PORT}
      - MCP_DEBUG=${MCP_DEBUG}
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL}
      - BACKEND_API_URL=${BACKEND_API_URL}
      - BACKEND_API_TIMEOUT=${BACKEND_API_TIMEOUT}
      - BACKEND_SERVICE_TOKEN=${BACKEND_SERVICE_TOKEN}
      - REDIS_URL=${REDIS_MCP_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE}
      - OPENAI_RATE_LIMIT_RPM=${OPENAI_RATE_LIMIT_RPM}
      - OPENAI_RATE_LIMIT_TPM=${OPENAI_RATE_LIMIT_TPM}
      - CONVERSATION_MEMORY_TTL=${CONVERSATION_MEMORY_TTL}
      - MAX_CONVERSATION_HISTORY=${MAX_CONVERSATION_HISTORY}
      - AGENT_MAX_RETRIES=${AGENT_MAX_RETRIES}
      - AGENT_RETRY_DELAY=${AGENT_RETRY_DELAY}
      - AGENT_TIMEOUT=${AGENT_TIMEOUT}
      - USE_DUMMY_DATA=${USE_DUMMY_DATA}
      - USE_MOCK_OPENAI=${USE_MOCK_OPENAI}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./mcp:/app
      - mcp_venv:/app/.venv
    depends_on:
      - backend
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jobassistant-network

# ==============================================================================
# Networks
# ==============================================================================
networks:
  jobassistant-network:
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
  redis_data:
  backend_venv:
  mcp_venv:
  frontend_node_modules:
    name: jobassistant-frontend-node-modules
  frontend_next_cache:
    name: jobassistant-frontend-next-cache
